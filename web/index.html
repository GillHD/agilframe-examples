<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Встраивание звонка AgilFrame</title>
<style>
  :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
  body { max-width: 72rem; margin: 2rem auto; padding: 0 1rem; }
  form { display: flex; flex-wrap: wrap; align-items: end; gap: 1rem; }
  label { display: grid; gap: .25rem; flex: 1 0 14rem; }
  input, button { font: inherit; padding: .55rem; }
  iframe { width: 100%; height: min(70vh, 48rem); min-height: 26rem; margin-top: 1rem; border: 1px solid GrayText; }
</style>
<main>
  <h1>Встроить звонок AgilFrame</h1>
  <form id="join">
    <label>Адрес Core <input name="server" type="url" value="http://localhost:8787" required></label>
    <label>Организация <input name="tenant" value="demo" required></label>
    <label>ID комнаты <input name="room" required></label>
    <label>Токен участника <input name="token" type="password" autocomplete="off" required></label>
    <button>Открыть звонок</button>
  </form>
  <p id="status" role="status"></p>
  <div id="call"></div>
</main>
<script type="module" src="./embed.js"></script>
</html>
